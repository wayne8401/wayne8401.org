<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Agent Station</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>

  <header class="top">
    <div class="brand">
      <span class="core" aria-hidden="true"></span>
      <div>
        <h1>Agent Station</h1>
        <p id="sourceLabel" class="muted">Demo feed</p>
      </div>
    </div>
    <div class="top-actions">
      <div class="live" id="liveBadge"><span class="dot"></span><span id="liveText">LIVE</span></div>
      <button class="icon-btn gear mic" data-act="voice-open" aria-label="Voice chat">🎙️</button>
      <button class="icon-btn gear" data-act="settings" aria-label="Settings">⚙️</button>
    </div>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabs" role="tablist">
    <button data-tab="station" class="active" role="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8" fill="none"/></svg>Station</button>
    <button data-tab="tasks" role="tab"><span class="badge" hidden></span><svg viewBox="0 0 24 24"><path d="M5 12l4 4 10-10" fill="none"/></svg>Tasks</button>
    <button data-tab="flows" role="tab"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="6" height="6" rx="1.5"/><rect x="15" y="14" width="6" height="6" rx="1.5"/><path d="M9 7h4a2 2 0 0 1 2 2v5" fill="none"/></svg>Flows</button>
    <button data-tab="brain" role="tab"><svg viewBox="0 0 24 24"><path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 6 1V5a2 2 0 0 0-3-1zM15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-6 1" fill="none"/></svg>Brain</button>
    <button data-tab="guide" role="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14" fill="none"/><circle cx="12" cy="17.2" r=".6"/></svg>Guide</button>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <section class="sheet-panel" role="dialog" aria-modal="true">
      <div class="grab" data-close></div>
      <div id="sheetBody"></div>
    </section>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
